name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# All jobs below run on synthetic, throwaway configuration. No repository
# secrets are referenced, so the workflow behaves identically on forks and
# never has access to the live Supabase project.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (compile, tests, dependency audit)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoice_assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Synthetic values only. The database suites create and drop their own
      # uniquely named scratch databases, so TEST_DATABASE_URL points at the
      # maintenance database and must differ from DATABASE_URL -- the safety
      # guard in tests/support/postgres.py refuses to run if they match.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/invoice_assistant_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      SUPABASE_JWT_SECRET: ci-only-not-a-real-secret
      SUPABASE_URL: http://localhost:54321
      SUPABASE_ANON_KEY: ci-only-anon-key
      OPENAI_API_KEY: ci-only-openai-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install WeasyPrint native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Byte-compile application sources
        working-directory: backend
        run: python -m compileall -q app

      # Includes the migration and two-user tenant-isolation suites, which
      # build their own scratch databases against the pgvector service above.
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

      - name: Audit Python dependencies
        working-directory: backend
        run: pip-audit --strict --requirement requirements.txt --requirement requirements-dev.txt

  frontend:
    name: Frontend (build, lint, dependency audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        # Synthetic Supabase config: the build only needs the vars to be defined.
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: ci-only-anon-key
        run: npm run build

      - name: Frontend tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Production dependencies ship to users, so they are held to a stricter
      # bar than build-time tooling. See docs/dependencies.md.
      - name: Verify React Router RSC advisory is unreachable
        working-directory: frontend
        run: node scripts/check-rsc-not-used.mjs

      - name: Audit npm production dependencies
        working-directory: frontend
        run: node scripts/npm-audit-policy.mjs --production

      - name: Audit npm build tooling
        working-directory: frontend
        run: node scripts/npm-audit-policy.mjs

  sql:
    name: SQL (schema applies cleanly)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoice_assistant_sql
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: invoice_assistant_sql
      PSQLRC: /dev/null

    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create Supabase-managed object stubs
        run: psql -v ON_ERROR_STOP=1 -f supabase/testing/supabase_stubs.sql

      - name: Apply core schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/setup_invoice_assistant_core.sql

      - name: Apply core schema again (must be idempotent)
        run: psql -v ON_ERROR_STOP=1 -f supabase/setup_invoice_assistant_core.sql

      - name: Apply per-client numbering migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/add_per_client_invoice_numbering.sql

      - name: Verify row level security is enabled on every owned table
        run: |
          psql -v ON_ERROR_STOP=1 -q -c "
            do \$\$
            declare unprotected text;
            begin
              select string_agg(relname, ', ')
                into unprotected
                from pg_class
                join pg_namespace on pg_namespace.oid = pg_class.relnamespace
               where nspname = 'public'
                 and relkind = 'r'
                 and not relrowsecurity;
              if unprotected is not null then
                raise exception 'Tables without row level security: %', unprotected;
              end if;
            end \$\$;
          "
